# ============================================================
# 每月长尾词挖掘：Google Suggest + DuckDuckGo 相关搜索（均为免费无密钥）
# 每月 1 日 UTC 04:20 运行，结果自动去重合并进 data/keywords/longtail.csv
# ============================================================
name: monthly-keywords

on:
  schedule:
    - cron: "20 4 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-keywords
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  mine:
    name: 长尾词挖掘
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 执行挖词并入库
        run: python -m pipeline.run_monthly
      - name: 上传词库快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keywords-${{ github.run_id }}
          path: data/keywords/longtail.csv
          retention-days: 30
          if-no-files-found: ignore
