# ============================================================
# 每日流水线：采集 → 翻译 → 生成 → 构建预检 → 推送
# 说明：
#   * cron 每天触发 3 次，脚本按“日期哈希”只在其中一个时段真正执行，
#     实现执行时间每日浮动 ±2 小时（防平台反爬），未命中时段的 job
#     在 gate 阶段就退出，几乎不消耗分钟额度；
#   * 采集在脚本层做分片（--shard i/n）串行执行，压缩单次请求峰值同时
#     避免并行 job 争抢 data/state 造成熔断状态错乱；
#   * Cloudflare Pages 用 Git 集成自动构建，因此本流程只负责把内容推回仓库，
#     不需要任何付费 API 或密钥。
# ============================================================
name: daily-pipeline

on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "43 3 * * *"
    - cron: "29 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略时段判定立即执行（1=强制）"
        default: "1"

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 必须与 config/settings.yaml 的 schedule.candidate_slots_utc 保持一致
  CANDIDATE_SLOTS: "1,3,5"
  PYTHONUTF8: "1"

jobs:
  gate:
    name: 时段判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: 判定今日是否为选定执行时段
        id: check
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '0' }}
        run: |
          python - <<'PY'
          import datetime, hashlib, os
          slots = [int(x) for x in os.environ["CANDIDATE_SLOTS"].split(",") if x.strip()]
          now = datetime.datetime.now(datetime.timezone.utc)
          seed = int(hashlib.md5(now.strftime("%Y-%m-%d").encode()).hexdigest(), 16)
          chosen = slots[seed % len(slots)]
          force = os.environ.get("FORCE_RUN") == "1"
          should = force or now.hour == chosen
          print("today slot=%02d utc_hour=%02d force=%s -> run=%s" % (chosen, now.hour, force, should))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("run=%s\n" % str(should).lower())
          PY

  pipeline:
    name: 采集与生成
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Hugo（用于推送前构建预检，失败即回滚）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: 采集分片 1/3
        continue-on-error: true
        run: python -m pipeline.collect --shard 1/3

      - name: 采集分片 2/3
        continue-on-error: true
        run: python -m pipeline.collect --shard 2/3

      - name: 采集分片 3/3
        continue-on-error: true
        run: python -m pipeline.collect --shard 3/3

      - name: 翻译 + 生成 + 校验 + 推送
        env:
          FORCE_RUN: "1"        # 时段判定已在 gate 完成，此处直接执行
        run: python -m pipeline.run_daily --skip-collect

      - name: 上传运行日志与巡检状态（保留 7 天，便于排障）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state-${{ github.run_id }}
          path: |
            data/state/*.json
            data/queue/*.json
          retention-days: 7
          if-no-files-found: ignore
