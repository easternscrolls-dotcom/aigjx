<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — AutoGuide</title>
<meta name="robots" content="noindex">
<style>
  :root{--fg:#1a1a1a;--muted:#6b7280;--accent:#2563eb;--bg:#f7f8fa;border:0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg);line-height:1.6}
  .site-header{padding:16px 24px;border-bottom:1px solid #e5e7eb}
  .brand{font-weight:700;color:var(--fg);text-decoration:none;font-size:18px}
  .wrap{max-width:720px;margin:48px auto;padding:0 24px}
  h1{font-size:32px;margin:0 0 8px}
  #nf-desc{color:var(--muted);margin:0 0 28px}
  #nf-search{display:flex;gap:8px;margin:0 0 28px;flex-wrap:wrap}
  #nf-search input[type=search]{flex:1;min-width:200px;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
  #nf-search button{padding:10px 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
  #nf-rec-title{font-weight:600;margin:0 0 12px}
  .cards{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{border:1px solid #e5e7eb;border-radius:10px;background:#fff;transition:border-color .15s}
  .card:hover{border-color:var(--accent)}
  .card a{display:block;padding:16px;color:var(--fg);text-decoration:none}
  .card h2{font-size:16px;margin:0}
  #nf-home{display:inline-block;margin-top:28px;color:var(--accent);text-decoration:none}
  .site-footer{margin-top:56px;padding:24px;border-top:1px solid #e5e7eb;color:var(--muted);font-size:13px}
  .muted{opacity:.7}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/en/">AutoGuide</a>
</header>
<main class="wrap">
  <h1 id="nf-title">404 — Page not found</h1>
  <p id="nf-desc">The page you were looking for doesn’t exist or has moved.</p>

  <form id="nf-search" action="https://www.google.com/search" method="get" target="_blank" rel="noopener">
    <input type="hidden" name="q" id="nf-q" value="site:freeai.72tool.com">
    <input type="search" id="nf-qtext" name="qtext" placeholder="Search freeai.72tool.com…" aria-label="search">
    <button type="submit" id="nf-btn">Search</button>
  </form>

  <p id="nf-rec-title">You might also like</p>
  <ul id="nf-rec" class="cards">
    <li class="card"><a href="/en/best/"><h2>Best Free AI Tools</h2></a></li>
    <li class="card"><a href="/en/tools/"><h2>AI Tools</h2></a></li>
    <li class="card"><a href="/en/art/"><h2>AI Articles</h2></a></li>
  </ul>

  <p><a id="nf-home" href="/">Go to homepage</a></p>
</main>
<footer class="site-footer">
  <p>Information is collected from public sources and may change without notice.</p>
  <p class="muted">&copy; 2026 AutoGuide</p>
</footer>
<script>
(function(){
  var I18N = {
    en: {title:"404 — Page not found", desc:"The page you were looking for doesn’t exist or has moved.", rec:"You might also like", btn:"Search", home:"Go to homepage"},
    es: {title:"Página no encontrada", desc:"La página que buscas no existe o se ha movido.", rec:"También te puede interesar", btn:"Buscar", home:"Ir al inicio"},
    id: {title:"Halaman tidak ditemukan", desc:"Halaman yang Anda cari tidak ada atau telah dipindahkan.", rec:"Mungkin Anda juga menyukai", btn:"Cari", home:"Ke beranda"}
  };
  var VERTS = {
    en: [["best","Best Free AI Tools"],["tools","AI Tools"],["art","AI Articles"],["video","AI Videos"]],
    es: [["best","Mejores herramientas IA"],["tools","Herramientas IA"],["art","Artículos IA"],["video","Vídeos IA"]],
    id: [["best","Alat AI Terbaik"],["tools","Alat AI"],["art","Artikel AI"],["video","Video AI"]]
  };
  var path = location.pathname || "/";
  var lm = path.match(/^\/(en|es|id)\b/);
  var lang = lm ? lm[1] : "en";
  var vm = path.match(/^\/(?:en|es|id)\/([a-z0-9_-]+)\//);
  var vert = vm ? vm[1] : null;
  var t = I18N[lang] || I18N.en;

  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("nf-title", t.title);
  set("nf-desc", t.desc);
  set("nf-rec-title", t.rec);
  set("nf-btn", t.btn);
  set("nf-home", t.home);
  var qs = document.getElementById("nf-qtext"); if (qs) qs.placeholder = t.rec + "…";
  var form = document.getElementById("nf-search");
  if (form) form.addEventListener("submit", function(){
    var q = (document.getElementById("nf-qtext").value || "").trim();
    document.getElementById("nf-q").value = "site:freeai.72tool.com " + q;
  });

  function render(list){
    var ul = document.getElementById("nf-rec");
    ul.innerHTML = "";
    list.slice(0, 3).forEach(function(r){
      var li = document.createElement("li");
      li.className = "card";
      var a = document.createElement("a");
      a.href = r.u;
      a.innerHTML = "<h2>" + (r.t || "").replace(/</g, "&lt;") + "</h2>";
      li.appendChild(a); ul.appendChild(li);
    });
  }
  function fallback(){
    render((VERTS[lang] || VERTS.en).map(function(v){ return {t:v[1], u:"/"+lang+"/"+v[0]+"/"}; }));
  }
  // 同赛道实时推荐：抓取该语种垂直落地页，提取最新卡片（同源、无硬编码、永不失效）
  var target = vert ? ("/" + lang + "/" + vert + "/") : ("/" + lang + "/");
  fetch(target).then(function(r){ return r.text(); }).then(function(html){
    var doc = new DOMParser().parseFromString(html, "text/html");
    var cards = [].slice.call(doc.querySelectorAll(".cards .card a")).map(function(a){
      return {t: a.textContent.trim(), u: a.getAttribute("href")};
    }).filter(function(x){ return x.t && x.u; });
    if (cards.length) render(cards); else fallback();
  }).catch(fallback);
})();
</script>
</body>
</html>
