{{/* 同垂直赛道交叉内链（快赢 #3）：Same-vertical 工具推荐，强化赛道主题集群。 */}}
{{ $items := .Params.similar | default slice }}
{{ if ge (len $items) 2 }}
<aside class="similar">
  <h2>{{ i18n "similar_tools" }}</h2>
  <ul>
    {{ range $items }}
      <li><a href="{{ .url }}">{{ .anchor | default .title }}</a></li>
    {{ end }}
  </ul>
</aside>
{{ end }}
