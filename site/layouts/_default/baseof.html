<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode | default .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>{{ i18n "disclaimer" }}</p>
    <p class="muted">&copy; {{ now.Year }} {{ .Site.Params.brand }}</p>
  </footer>
</body>
</html>
