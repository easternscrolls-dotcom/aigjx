{{ define "main" }}
<section class="wrap section">
  <h1>Categories</h1>
  <div class="cat-grid">
    {{ range .Data.Terms.Alphabetical }}
    <a class="cat-card" href="{{ .Page.RelPermalink }}">
      <span class="cat-name">{{ .Page.Title }}</span>
      <span class="cat-count">{{ .Count }}</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
