{{ define "main" }}
<section class="wrap section">
  <h1>AI Agent &amp; Automation Tools</h1>
  <p class="lead">{{ .Site.Params.description }}</p>
  <div class="filters" id="cat-filters">
    <button class="filter-btn active" data-cat="all" type="button">All</button>
    {{ range .Site.Taxonomies.categories.Alphabetical }}<button class="filter-btn" data-cat="{{ .Page.Title | urlize }}" type="button">{{ .Page.Title }}</button>{{ end }}
  </div>
  <div class="tool-grid" id="tool-grid">
    {{ range .Pages }}
      <div class="tool-cell" data-cats="{{ range .Params.categories }}{{ . | urlize }} {{ end }}">
        {{ partial "tool-card.html" . }}
      </div>
    {{ end }}
  </div>
</section>
<script src="{{ "js/tools.js" | relURL }}" defer></script>
{{ end }}
